# Proves Storybound on a real Windows computer: the tests, the app itself, and the installer.
name: Windows

on:
  push:
    paths-ignore:
      - 'apps/mobile/**'
      - '**.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Keep line endings as they are in the repository
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm

      - name: Install
        run: npm ci

      - name: Run the tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Run the app through its end-to-end tests
        run: npx playwright test

      - name: Make the installer
        run: npx electron-builder --win --publish never

      # A folder name with a space in it, as most Windows user folders have.
      - name: Install it, as someone downloading it would
        shell: pwsh
        run: |
          $installer = Get-ChildItem dist\*-setup.exe | Select-Object -First 1
          $target = Join-Path $env:RUNNER_TEMP 'Storybound Check'
          Start-Process -FilePath $installer.FullName -ArgumentList '/S', "/D=$target" -Wait
          "STORYBOUND_INSTALLED=$target\Storybound.exe" >> $env:GITHUB_ENV

      - name: Open the installed app, save a book and read a sentence aloud
        timeout-minutes: 20
        run: node scripts/check-packaged-app.mjs "$env:STORYBOUND_INSTALLED"

      - name: Keep the installer
        uses: actions/upload-artifact@v7
        with:
          name: storybound-windows-installer
          path: dist/*-setup.exe
          retention-days: 14

      - name: Keep the evidence if something failed
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: failure-details
          path: |
            test-results/
            playwright-report/
          retention-days: 14
