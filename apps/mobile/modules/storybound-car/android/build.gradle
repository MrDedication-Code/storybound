plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'com.storybound.car'
version = '1.0.0'

android {
  namespace "expo.modules.storyboundcar"
  defaultConfig {
    versionCode 1
    versionName "1.0.0"
  }
}

repositories {
  mavenCentral()
}

dependencies {
  // The same Media3 as expo-audio's player, for the library Android Auto browses.
  implementation "androidx.media3:media3-session:1.9.1"
  implementation 'com.facebook.react:react-android'
}
